<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalendarz zadań</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header__inner">
    <span class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Kalendarz zadań
    </span>
    <div class="user" id="user" hidden>
      <span class="user__email" id="user-email"></span>
      <button class="btn btn--secondary" type="button" id="wyloguj">Wyloguj się</button>
    </div>
  </div>
</header>

<main>
  <div class="page">

    <p class="loading" id="ladowanie" role="status">Ładowanie…</p>

    <!-- Ekran logowania -->
    <section class="login" id="ekran-logowania" hidden>
      <form id="form-logowanie" novalidate>
        <h1 tabindex="-1">Zaloguj się</h1>
        <p class="login__intro">Zaloguj się, aby zobaczyć swoje faktury i zadania.</p>

        <div class="alert" id="blad-logowania" role="alert" hidden></div>

        <div class="field">
          <label for="email">Adres e-mail</label>
          <input class="input" id="email" name="email" type="email" autocomplete="username" inputmode="email" aria-describedby="blad-email">
          <p class="field__error" id="blad-email" hidden></p>
        </div>

        <div class="field">
          <label for="haslo">Hasło</label>
          <input class="input" id="haslo" name="haslo" type="password" autocomplete="current-password" aria-describedby="blad-haslo">
          <p class="field__error" id="blad-haslo" hidden></p>
          <label class="checkbox"><input type="checkbox" id="pokaz-haslo"> Pokaż hasło</label>
        </div>

        <button class="btn btn--primary btn--wide" type="submit" id="zaloguj">Zaloguj się</button>

        <p class="login__note">Konta zakłada administrator aplikacji. Jeśli nie masz konta albo nie pamiętasz hasła, skontaktuj się z nim.</p>
      </form>
    </section>

    <!-- Ekran po zalogowaniu (miejsce na kalendarz) -->
    <section class="welcome" id="ekran-glowny" hidden>
      <h1 tabindex="-1">Jesteś zalogowany</h1>
      <p>Zalogowano jako <strong id="powitanie-email"></strong>.</p>
      <div class="placeholder">Tu pojawi się kalendarz faktur i zadań.</div>
    </section>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
